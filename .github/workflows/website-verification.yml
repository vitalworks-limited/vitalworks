name: Website verification and lockfile bootstrap
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-unit:
    name: Dependency-free Node regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all dependency-free Node tests
        run: node --test tests/*.test.mjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies and generate initial lockfile when missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --no-audit --no-fund
          fi
      - name: Enable npm cache after lockfile exists
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Upload npm lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Source checks and dependency-backed verification
        run: npm run verify
        env:
          NEXT_PUBLIC_SITE_URL: https://www.vitalworks.example
          NEXT_PUBLIC_SITE_PUBLISHED: 'false'
